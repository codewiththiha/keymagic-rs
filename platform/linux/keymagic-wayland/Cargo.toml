[package]
name = "keymagic-linux-wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keymagic-wayland"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
keymagic-engine = { path = "../../../crates/keymagic-engine", version = "0.1.0" }
keymagic-host = { path = "../../../crates/keymagic-host", version = "0.1.0" }
keymagic-types = { path = "../../../crates/keymagic-types", version = "0.1.0" }
xkbcommon = { version = "0.9", default-features = false }

[lints]
workspace = true
