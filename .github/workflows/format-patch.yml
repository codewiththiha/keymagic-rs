name: Create formatting patch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Format on self-hosted runner
        shell: bash
        run: |
          test -f Cargo.toml || { echo '::error::Cargo workspace not implemented'; exit 1; }
          cargo fmt --all
          cargo fmt --manifest-path fuzz/Cargo.toml
          rustfmt --edition 2024 tools/codec_reference.rs
          git diff --binary > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: format.patch
          if-no-files-found: error
