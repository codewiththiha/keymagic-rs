name: Cross-platform verification
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-dev libayatana-appindicator3-dev libgl1-mesa-dri libegl1 libxkbcommon-dev libxkbcommon-x11-0
      - name: Require Rust workspace
        shell: bash
        run: test -f Cargo.toml || { echo '::error::Cargo workspace not implemented'; exit 1; }
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Test workspace
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build IBus engine for the CLI install test
        if: runner.os == 'Linux'
        run: cargo build --locked -p keymagic-linux-ibus --bin keymagic-ibus
      - name: Test workspace under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" cargo test --locked --workspace --no-fail-fast
      - name: Named pipe and socket transport
        run: cargo test --locked -p keymagic-host --test ipc
