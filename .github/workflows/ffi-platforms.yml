name: FFI on three platforms

on:
  push:
    paths:
      - "Cargo.lock"
      - "corpus/km2/**"
      - "crates/keymagic-engine/**"
      - "crates/keymagic-ffi/**"
      - "crates/keymagic-km2/**"
      - "crates/keymagic-kms/**"
      - "crates/keymagic-types/**"
      - ".github/workflows/ffi-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctypes:
    name: ctypes on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build keymagic-ffi
        run: cargo build --locked --package keymagic-ffi
      - name: Run ctypes tests
        run: python crates/keymagic-ffi/tests/test_ffi.py
