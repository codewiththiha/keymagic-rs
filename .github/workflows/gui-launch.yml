name: GUI launch check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Headless launch check of the app shell
        run: cargo test --locked -p keymagic-gui --test launch
