name: GUI launch check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-dev libayatana-appindicator3-dev libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Headless launch check of the app shell
        shell: bash
        run: cargo test --locked -p keymagic-gui --test launch
      - name: Open the window under a virtual display (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          cargo build --locked -p keymagic-gui
          mkdir -p launch
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            target/debug/keymagic-gui --capture "launch/${{ matrix.os }}.png"
      - name: Software OpenGL for Windows (hosted runners have no GPU)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/24.2.8/mesa3d-24.2.8-release-msvc.7z
          echo "703f73ba8834de87a3ff21fb96b71ca5629a9c476610729faea0108001cd95f2  mesa.7z" | sha256sum -c -
          7z x mesa.7z -omesa x64 -y > /dev/null
      - name: Open the window, save a screenshot and close it
        if: runner.os != 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          cargo build --locked -p keymagic-gui
          if [ "$RUNNER_OS" = "Windows" ]; then cp mesa/x64/*.dll target/debug/; fi
          mkdir -p launch
          target/debug/keymagic-gui --capture "launch/${{ matrix.os }}.png"
      - name: Check the screenshot exists
        shell: bash
        run: test -s "launch/${{ matrix.os }}.png"
      - name: Upload the screenshot
        uses: actions/upload-artifact@v4
        with:
          name: launch-${{ matrix.os }}
          path: launch/${{ matrix.os }}.png
          if-no-files-found: error
