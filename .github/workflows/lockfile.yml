name: Generate lockfile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate lockfile on self-hosted runner
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
