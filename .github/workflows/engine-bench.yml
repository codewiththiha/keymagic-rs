name: Engine benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run engine throughput benchmark
        run: |
          cargo bench --locked --package keymagic-engine --bench engine 2>&1 | tee engine-bench.log
      - uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark
          path: engine-bench.log
          if-no-files-found: error
