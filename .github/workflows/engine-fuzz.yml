name: Engine fuzz checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fuzzing tools
        run: |
          rustup toolchain install nightly-2026-11-21 --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
          cargo fuzz --version
      - name: Fuzz engine key streams for ten minutes
        run: cargo +nightly-2026-11-21 fuzz run engine_keys -- -max_total_time=600 -timeout=10
      - name: Save failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
