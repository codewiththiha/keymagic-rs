name: Development CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  development:
    # Never run untrusted fork code on a self-hosted machine. Repository owners
    # must also restrict branch write access and isolate runner credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test commit policy script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check commit messages and authors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            range="$HEAD_SHA^!"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # New branches and force pushes may not have their old base available.
            range="$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          python3 scripts/check_commit_messages.py --range "$range"
          python3 scripts/check_commit_authors.py --range "$range"
      - name: Check changed source comments
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git diff --diff-filter=ACMR --name-only -z "$base" "$HEAD_SHA" -- '*.rs' '*.py')
          if (( ${#files[@]} )); then
            python3 tools/comment_check.py "${files[@]}"
            python3 tools/comment_budget.py --base "$base" "${files[@]}"
          else
            echo 'No changed Rust or Python source files.'
          fi
      - name: Require Rust workspace
        run: test -f Cargo.toml || { echo '::error::Cargo workspace not implemented; Rust checks have not run'; exit 1; }
      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Dependency policy
        run: cargo deny check
