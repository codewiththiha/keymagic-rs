name: Development CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  development:
    # Never run untrusted fork code on a self-hosted machine. Repository owners
    # must also restrict branch write access and isolate runner credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test commit policy script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check commit messages and authors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            range="$HEAD_SHA^!"
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # New branches and force pushes may not have their old base available.
            range="$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          python3 scripts/check_commit_messages.py --range "$range"
          python3 scripts/check_commit_authors.py --range "$range"
      - name: Check changed source comments
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          base=$(python3 scripts/comment_diff_base.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git diff --diff-filter=ACMR --name-only -z "$base" "$HEAD_SHA" -- '*.rs' '*.py' ':(exclude)corpus/reference/km3/**')
          if (( ${#files[@]} )); then
            python3 tools/comment_check.py "${files[@]}"
            python3 tools/comment_budget.py --base "$base" "${files[@]}"
          else
            echo 'No changed Rust or Python source files.'
          fi
      - name: Require Rust workspace
        run: test -f Cargo.toml || { echo '::error::Cargo workspace not implemented; Rust checks have not run'; exit 1; }
      - name: Verify committed lockfile
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo metadata --locked --no-deps --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          rustfmt --edition 2024 --check tools/codec_reference.rs
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify Clippy rejects unwrap
        shell: bash
        run: |
          dir=$(mktemp -d)
          file=xtask/src/main.rs
          cp "$file" "$dir/original"
          trap 'cp "$dir/original" "$file"; rm -rf "$dir"' EXIT
          printf '\n#[cfg(test)]\n#[test]\nfn lint_probe() { let _value = std::env::var("PROBE").unwrap(); }\n' >> "$file"
          if cargo clippy --locked --package xtask --all-targets -- -D warnings > "$dir/output" 2>&1; then
            echo '::error::Clippy accepted the intentional unwrap'; exit 1
          fi
          if ! grep -Eq 'clippy::unwrap[-_]used' "$dir/output"; then
            cat "$dir/output"; echo '::error::Clippy failed for an unrelated reason'; exit 1
          fi
          echo 'Clippy rejected the intentional unwrap as expected.'
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Build public documentation
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Check pinned corpus
        run: cargo run --locked --package xtask -- corpus-sync --check
      - name: Dependency policy
        run: cargo deny check
