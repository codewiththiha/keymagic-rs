[[case]]
name = "state_digits"
keyboard = "kms/cases/state_digits.kms"
upstream_test = "keymagic-core/tests/state_tests.rs::test_state_based_digit_conversion"
events = [
  { key = "1", action = "insert", text = "၁" },
  { key = "2", action = "insert", text = "၂", composing = "၁၂" },
  { vk = 92 },
  { key = "1", action = "insert", text = "ဍ္ဍ", composing = "၁၂ဍ္ဍ" },
  { key = "2", action = "insert", text = "၂", composing = "၁၂ဍ္ဍ၂" },
  { vk = 92 },
  { key = "2", action = "insert", text = "ဎ္ဎ", composing = "၁၂ဍ္ဍ၂ဎ္ဎ" },
]

[[case]]
name = "active_states"
