[[case]]
name = "state_lifetime"
keyboard = "kms/cases/state_lifetime.kms"
upstream_test = "keymagic-core/tests/state_tests.rs::test_basic_state_toggle"
events = [
  { key = "1", action = "insert", text = "1", composing = "1" },
  { vk = 92, action = "none", composing = "1" },
  { key = "1", action = "insert", text = "၁", composing = "1၁" },
  { key = "1", action = "insert", text = "1", composing = "1၁1" },
]

[[case]]
name = "multiple_states"
keyboard = "kms/cases/multiple_states.kms"
upstream_test = "keymagic-core/tests/state_tests.rs::test_multiple_states"
events = [
  { vk = 68 },
  { key = "a", action = "insert", text = "A1", composing = "A1" },
  { key = "a", action = "insert", text = "a", composing = "A1a" },
  { vk = 69 },
  { key = "a", action = "insert", text = "A2", composing = "A1aA2" },
]

