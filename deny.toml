# Conservative GPL-2.0-only-compatible allowlist; review new dependencies.
[licenses]
confidence-threshold = 0.8
allow = [
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Approved by the user on 2026-11-22: notify (file watcher).
    "CC0-1.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "ISC",
    "Unicode-3.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    # Approved by the user on 2026-11-22: image (BMP to PNG) via flate2 and png.
    "Zlib",
    # Approved by the user on 2026-11-22: interprocess (0BSD OR Apache-2.0).
    "0BSD",
    # Approved by the user on 2026-11-22: ureq TLS (ring, aws-lc-sys).
    "Apache-2.0",
    # Approved by the user on 2026-11-22: ureq TLS roots (webpki-roots).
    "CDLA-Permissive-2.0",
    # Approved by the user on 2026-11-22: clipboard-win and error-code (egui clipboard).
    "BSL-1.0",
    # Approved by the user on 2026-11-22: walkdir and same-file (egui_kittest snapshots).
    "Unlicense",
    # Approved by the user on 2026-11-22: embedded Inter, Noto Sans Myanmar and JetBrains Mono.
    "OFL-1.1",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
